# Pull docs content from TeelOrg/mintlify-docs into this repo.
#
# Why this exists: Mintlify is wired to deploy from THIS repo
# (TeelOrg/docs), but all docs content is authored in
# TeelOrg/mintlify-docs. This workflow keeps the two in sync: it
# runs on a cron (and on demand), checks out mintlify-docs over SSH
# using a read-only deploy key (mintlify-docs is private), rsyncs
# the tree into this repo, and commits with the built-in GITHUB_TOKEN
# (which has push access to this repo by default).
#
# Auth setup:
#   - Public half: deploy key on TeelOrg/mintlify-docs (read-only)
#   - Private half: secrets.MINTLIFY_DOCS_DEPLOY_KEY on this repo
#
# Rotation runbook (when it breaks or a key holder rolls off):
#   docs/superpowers/2026-06-16-deploy-key-rotation.md
#   (canonical: https://app.notion.com/p/3816d359062f8142af81f292c3715822)
#
# This is a stop-gap until the Mintlify dashboard is repointed to
# read directly from TeelOrg/mintlify-docs — delete this workflow
# the day that lands.

name: Pull from TeelOrg/mintlify-docs

on:
  schedule:
    # Every 2 days at 12:00 UTC. Docs change rarely enough that the
    # original 10-minute polling burned hundreds of Actions minutes/month
    # for nothing. When you merge a docs PR and want it live now, hit
    # "Run workflow" — that path is unchanged.
    #
    # Cron quirk: `*/2` on the day-of-month field divides the calendar
    # month (1, 3, 5, …, 29, 31, 1, 3 …), so months with 31 days run
    # two days in a row at the rollover. Still well within "rare" and
    # not worth working around.
    - cron: '0 12 */2 * *'
  workflow_dispatch: {}     # manual run for immediate sync

# Serialize runs so an in-flight sync isn't fighting a new one.
concurrency:
  group: pull-from-mintlify-docs
  cancel-in-progress: false

permissions:
  contents: write  # required for GITHUB_TOKEN to push back to this repo

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (TeelOrg/docs)
        uses: actions/checkout@v4
        with:
          path: target
          # token is the default GITHUB_TOKEN, which can push to its
          # own repo when permissions.contents is write (above).

      - name: Checkout TeelOrg/mintlify-docs (private, deploy key)
        uses: actions/checkout@v4
        with:
          repository: TeelOrg/mintlify-docs
          ssh-key: ${{ secrets.MINTLIFY_DOCS_DEPLOY_KEY }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Capture source SHA
        id: src
        working-directory: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Mirror tree
        # --delete makes the mirror absolute — files removed from
        # mintlify-docs are removed here.
        # Excludes:
        #   .git           — keep target's git history intact
        #   .github        — don't overwrite this workflow with anything
        #                    mintlify-docs might add under .github
        #   node_modules   — local build artifacts
        #   .DS_Store      — macOS junk
        run: |
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.DS_Store' \
            source/ target/

      - name: Commit + push if changed
        working-directory: target
        env:
          SRC_SHA: ${{ steps.src.outputs.sha }}
        run: |
          git config user.name "teel-docs-sync[bot]"
          git config user.email "teel-docs-sync@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to mirror — exiting clean."
            exit 0
          fi
          git add -A
          git commit -m "sync: mirror from mintlify-docs@${SRC_SHA:0:7}

          Auto-mirrored by .github/workflows/pull-from-mintlify-docs.yml.
          All docs content is authored in TeelOrg/mintlify-docs; edits
          should target that repo and arrive here on the 10-minute cron.

          Source commit: https://github.com/TeelOrg/mintlify-docs/commit/${SRC_SHA}"
          git push
